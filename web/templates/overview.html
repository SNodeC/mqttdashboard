{% extends "layout.html" %}
{% block content %}
<section class="device-grid" id="devices" aria-label="Observed devices">
  <button class="device-card add-device" id="add-device" type="button" aria-haspopup="dialog"><span class="add-icon"><img src="/assets/images/home-icon-plus.svg" alt=""></span><strong>Add device</strong></button>
</section>
<template id="device-card">
  <a class="device-card" href="/">
    <div class="device-picture"><div class="device-illustration"><span class="antenna"></span><span class="device-body"></span><span class="device-screen"></span><img src="/assets/images/home-icon-bolt.svg" alt="" class="device-bolt"></div></div>
    <strong data-device-label></strong><span class="chip" data-message-state><i class="status-dot"></i><span></span></span>
  </a>
</template>
<nav class="location-links" aria-label="Locations">{% for item in site.navigation %}<a href="{{ item.href }}">{{ item.label }}</a>{% endfor %}</nav>
{% endblock %}
