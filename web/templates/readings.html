<section aria-labelledby="readings-heading">
  <div class="section-heading"><div><p class="eyebrow">LATEST BY DEVICE &amp; FPORT</p>
    <h2 id="readings-heading">Current readings</h2></div>
    <div class="filters">
      {% if page.view == "overview" %}<label>Device<select id="device"><option value="">All devices</option></select></label>{% endif %}
      <label>Payload<select id="fport"><option value="">All FPorts</option></select></label>
    </div>
  </div>
  <div id="measurements" class="measurements"></div>
</section>
<section id="recent" aria-labelledby="recent-heading">
  <div class="section-heading"><div><p class="eyebrow">OBSERVATION LOG</p>
    <h2 id="recent-heading">Recent uplinks</h2></div><span class="muted">Newest observations first</span></div>
  <div class="table-scroll"><table><thead><tr><th>Received</th><th>Device</th><th>FPort</th><th>Measurements</th><th>Source</th></tr></thead>
    <tbody id="history"></tbody></table></div>
</section>
