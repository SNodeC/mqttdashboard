[in-mqtt]
disabled = false
[in-mqtt.remote]
host = "127.0.0.1"
port = 1883
[in-mqtt.session]
client-id = "mock-store"
[in-mqtt.sub]
topic = "v3/mock-lab@ttn/devices/+/up"
[in-mqtt.db]
host = "localhost"
socket = "/run/mysqld/mysqld.sock"
database = "ttn_dashboard"
username = "dashboard_store"
password = "mock-store-password"
[in-mqtt.db.storage]
raw-table = "mqtt_messages"
auto-create-raw-table = true
projection-file = "config/projections.json"
